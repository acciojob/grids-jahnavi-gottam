<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <!-- Row 1 -->
        <div class="row row-box">
            <div class="col-6 col-md-4 column row1-col1">
                Row1 col1
            </div>

            <div class="col-6 col-md-8 column row1-col2">
                Row1 col2
            </div>
        </div>

        <!-- Row 2 -->
        <div class="row row-box">

            <div class="offset-md-2 col-md-4 column row2-col1">
                Row2 col1
            </div>

            <div class="offset-md-2 col-md-4 column row2-col2">
                Row2 col2
            </div>

        </div>

        <!-- Row 3 -->
        <div class="row row-box justify-content-center">

            <div class="col-md-4 column row3-col1">
                Row3 col1
            </div>

            <div class="col-md-4 column row3-col2">
                Row3 col2
            </div>

        </div>

    </div>

</body>
</html>
